<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya İndir - SeydimDosya</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #007bff;
            margin-bottom: 30px;
        }
        .file-info {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }
        .file-info p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        .file-info strong {
            color: #007bff;
        }
        .download-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
            text-decoration: none;
            margin-top: 20px;
        }
        .download-button:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .error-message {
            color: #dc3545;
            padding: 20px;
            background-color: #f8d7da;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            display: none;
            margin: 20px 0;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dosya İndirme</h1>
        <div class="error-message" id="errorMessage"></div>
        <div class="file-info" id="fileInfo">
            <p>
                <span>Dosya Adı:</span>
                <strong id="fileName">Yükleniyor...</strong>
            </p>
            <p>
                <span>Dosya Boyutu:</span>
                <strong id="fileSize">Yükleniyor...</strong>
            </p>
            <p>
                <span>Gönderen:</span>
                <strong id="sender">Yükleniyor...</strong>
            </p>
            <p>
                <span>Gönderilme Tarihi:</span>
                <strong id="sendDate">Yükleniyor...</strong>
            </p>
        </div>
        <div class="loading" id="loading"></div>
        <a href="#" class="download-button" id="downloadButton" download>
            Dosyayı İndir
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.pathname);
            const downloadLink = window.location.pathname.split('/download/')[1];
            
            if (!downloadLink) {
                showError('Geçersiz indirme bağlantısı');
                return;
            }

            try {
                const response = await fetch(`/api/file-info/${downloadLink}`);
                if (!response.ok) {
                    throw new Error(response.statusText);
                }

                const fileInfo = await response.json();
                
                document.getElementById('fileName').textContent = fileInfo.file_name;
                document.getElementById('fileSize').textContent = formatFileSize(fileInfo.file_size);
                document.getElementById('sender').textContent = fileInfo.sender_email;
                document.getElementById('sendDate').textContent = formatDate(fileInfo.created_at);
                
                const downloadButton = document.getElementById('downloadButton');
                downloadButton.href = `/download/${downloadLink}`;
                
            } catch (error) {
                showError('Dosya bilgileri alınamadı. Bağlantı geçersiz olabilir veya dosya silinmiş olabilir.');
                document.getElementById('fileInfo').style.display = 'none';
                document.getElementById('downloadButton').style.display = 'none';
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('tr-TR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
