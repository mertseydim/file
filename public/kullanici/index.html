<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Paneli - Dosya Transferi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-email {
            font-weight: bold;
            color: #007bff;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #007bff;
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: 700;
            color: #444;
        }
        input[type="email"], input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .logout {
            background-color: #dc3545;
            padding: 8px 16px;
        }
        .logout:hover {
            background-color: #c82333;
        }
        .file-info {
            font-size: 13px;
            color: #666;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        #history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #history-table th, #history-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        #history-table th {
            background-color: #f8f9fa;
            font-weight: 700;
        }
        #history-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        #history-table tr:hover {
            background-color: #f2f2f2;
        }
        .spinner {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        .success {
            color: #28a745;
            margin-top: 10px;
            text-align: center;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
            text-align: center;
        }
        button.loading .spinner {
            display: inline-block;
        }
        button.loading span {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                Hoş geldiniz, <span class="user-email" id="userEmail"></span>
            </div>
            <div class="nav-links" style="display: flex; gap: 10px;">
                <a href="/profile" style="color: #007bff; text-decoration: none;">Profil</a>
                <button class="logout" onclick="logout()">Çıkış Yap</button>
            </div>
        </div>

        <div class="content">
            <div class="panel">
                <h2>Dosya Gönder</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="hidden" id="sender" name="sender">
                    
                    <label for="receiver">Alıcı Email</label>
                    <input type="email" id="receiver" name="receiver" required>
                    
                    <label for="file">Dosya Seç (Max 1GB)</label>
                    <input type="file" id="file" name="file" required>
                    <div class="file-info">Maksimum dosya boyutu: 1GB</div>
                    
                    <button type="submit"><span>Yükle ve Gönder</span><div class="spinner"></div></button>
                    <div id="uploadMessage"></div>
                </form>
            </div>

            <div class="panel">
                <h2>Gönderim Geçmişi</h2>
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Dosya Adı</th>
                            <th>Boyut</th>
                            <th>Alıcı</th>
                            <th>Tarih</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            const userEmail = localStorage.getItem('user_email');
            
            if (!token || !userEmail) {
                window.location.href = '/giris';
                return;
            }

            document.getElementById('userEmail').textContent = userEmail;
            document.getElementById('sender').value = userEmail;
            loadHistory();
        }

        // Load history
        async function loadHistory() {
            const token = localStorage.getItem('jwt_token');
            const tableBody = document.getElementById('history-table').querySelector('tbody');
            tableBody.innerHTML = '';

            try {
                const response = await fetch('/history', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Geçmiş yüklenemedi');
                }

                const history = await response.json();
                history.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.file_name}</td>
                        <td>${formatFileSize(item.file_size)}</td>
                        <td>${item.receiver_email}</td>
                        <td>${item.created_at}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Geçmiş yüklenirken hata:', error);
            }
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Upload handler
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const token = localStorage.getItem('jwt_token');
            const messageDiv = document.getElementById('uploadMessage');
            const button = this.querySelector('button');
            
            button.classList.add('loading');
            button.disabled = true;
            messageDiv.innerHTML = '';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(response.statusText || 'Yükleme başarısız');
                }

                const data = await response.text();
                messageDiv.innerHTML = `<div class="success">${data}</div>`;
                this.reset();
                document.getElementById('sender').value = localStorage.getItem('user_email');
                loadHistory(); // Refresh history after successful upload
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">Bir hata oluştu: ${error.message}</div>`;
            } finally {
                button.classList.remove('loading');
                button.disabled = false;
            }
        });

        // Logout handler
        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_email');
            window.location.href = '/';
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
