<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Dosya Transferi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        h2 {
            margin-top: 0;
            color: #007bff;
            font-size: 24px;
            text-align: center;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: 700;
            color: #444;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error {
            color: #dc3545;
            margin-top: -15px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kayıt Ol</h2>
        <form id="registerForm">
            <label for="email">E-posta</label>
            <input type="email" id="email" required>
            <div id="emailError" class="error"></div>
            
            <label for="password">Şifre</label>
            <input type="password" id="password" required>
            <div id="passwordError" class="error"></div>
            
            <label for="confirmPassword">Şifre Tekrar</label>
            <input type="password" id="confirmPassword" required>
            <div id="confirmPasswordError" class="error"></div>
            
            <button type="submit">Kayıt Ol</button>
        </form>
        <div class="links">
            <a href="/giris">Giriş Yap</a>
            <a href="/">Ana Sayfa</a>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }

        function hideError(element) {
            element.style.display = 'none';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let isValid = true;

            // Reset errors
            hideError(emailError);
            hideError(passwordError);
            hideError(confirmPasswordError);

            // Validate email
            if (!validateEmail(emailInput.value)) {
                showError(emailError, 'Geçerli bir e-posta adresi giriniz');
                isValid = false;
            }

            // Validate password
            if (!validatePassword(passwordInput.value)) {
                showError(passwordError, 'Şifre en az 6 karakter olmalıdır');
                isValid = false;
            }

            // Validate password confirmation
            if (passwordInput.value !== confirmPasswordInput.value) {
                showError(confirmPasswordError, 'Şifreler eşleşmiyor');
                isValid = false;
            }

            if (!isValid) return;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: emailInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert('Kayıt başarılı! Giriş yapabilirsiniz.');
                    window.location.href = '/giris';
                } else {
                    alert(data.error || 'Kayıt işlemi başarısız oldu');
                }
            } catch (error) {
                alert('Bir hata oluştu: ' + error.message);
            }
        });

        // Real-time validation
        emailInput.addEventListener('input', () => {
            if (emailInput.value && !validateEmail(emailInput.value)) {
                showError(emailError, 'Geçerli bir e-posta adresi giriniz');
            } else {
                hideError(emailError);
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value && !validatePassword(passwordInput.value)) {
                showError(passwordError, 'Şifre en az 6 karakter olmalıdır');
            } else {
                hideError(passwordError);
            }
        });

        confirmPasswordInput.addEventListener('input', () => {
            if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
                showError(confirmPasswordError, 'Şifreler eşleşmiyor');
            } else {
                hideError(confirmPasswordError);
            }
        });
    </script>
</body>
</html>
