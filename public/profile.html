<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Dosya Transferi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #007bff;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .profile-info {
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            font-weight: bold;
            color: #666;
        }
        .info-value {
            color: #333;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
        }
        .success {
            color: #28a745;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Profil</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">Ana Sayfa</a>
                <a href="/kullanici" class="nav-link">Dosya Gönder</a>
                <button onclick="logout()" style="background: #dc3545;">Çıkış Yap</button>
            </div>
        </div>

        <div class="content">
            <div class="panel">
                <h2>Profil Bilgileri</h2>
                <div class="profile-info">
                    <div class="info-row">
                        <span class="info-label">E-posta</span>
                        <span class="info-value" id="userEmail"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Kayıt Tarihi</span>
                        <span class="info-value" id="createdAt"></span>
                    </div>
                </div>

                <h2>Şifre Değiştir</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">Mevcut Şifre</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Yeni Şifre</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit">Şifreyi Güncelle</button>
                    <div id="passwordMessage"></div>
                </form>
            </div>

            <div class="panel">
                <h2>İstatistikler</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalUploads">-</div>
                        <div class="stat-label">Toplam Gönderim</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalSize">-</div>
                        <div class="stat-label">Toplam Boyut</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgSize">-</div>
                        <div class="stat-label">Ortalama Dosya Boyutu</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="uniqueReceivers">-</div>
                        <div class="stat-label">Benzersiz Alıcı</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                window.location.href = '/giris';
                return;
            }
            loadProfile();
            loadStats();
        }

        // Load profile
        async function loadProfile() {
            try {
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Profil bilgileri alınamadı');
                }

                const data = await response.json();
                document.getElementById('userEmail').textContent = data.email;
                document.getElementById('createdAt').textContent = data.created_at;
            } catch (error) {
                console.error('Profil yükleme hatası:', error);
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/profile/stats', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('İstatistikler alınamadı');
                }

                const data = await response.json();
                document.getElementById('totalUploads').textContent = data.stats.total_uploads;
                document.getElementById('totalSize').textContent = data.total_size_formatted;
                document.getElementById('avgSize').textContent = data.avg_size_formatted;
                document.getElementById('uniqueReceivers').textContent = data.stats.unique_receivers;
            } catch (error) {
                console.error('İstatistik yükleme hatası:', error);
            }
        }

        // Password update
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('passwordMessage');

            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error">Yeni şifreler eşleşmiyor</div>';
                return;
            }

            try {
                const response = await fetch('/api/profile/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    messageDiv.innerHTML = '<div class="success">Şifre başarıyla güncellendi</div>';
                    this.reset();
                } else {
                    messageDiv.innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">Bir hata oluştu</div>';
            }
        });

        // Logout
        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_email');
            window.location.href = '/giris';
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
